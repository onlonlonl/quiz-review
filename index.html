<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Review</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#f5f5f5;color:#333;font-size:18px}
.header{background:#fff;border-bottom:1px solid #e0e0e0;padding:28px 40px}
.header h1{font-size:28px;font-weight:600;margin-bottom:10px}
.header .sub{font-size:16px;color:#999;margin-bottom:14px}
.stats{display:flex;gap:24px;font-size:17px;color:#666;flex-wrap:wrap;align-items:center}
.stats .num{font-weight:600;color:#2b4280;font-size:20px}
.stats .removed{color:#c45555}
.stats .sync{font-size:15px;color:#999;margin-left:auto}
.stats .sync.ok{color:#166534}
.stats .sync.err{color:#c45555}
.toolbar{background:#fff;border-bottom:1px solid #e0e0e0;padding:16px 40px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:99}
.toolbar input[type="text"]{padding:10px 16px;border:1px solid #ccc;border-radius:8px;font-size:17px;width:300px}
.toolbar select{padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:17px;background:#fff}
.toolbar .spacer{flex:1}
.btn{padding:12px 24px;border:none;border-radius:8px;font-size:17px;cursor:pointer;font-weight:500}
.btn-primary{background:#2b4280;color:#fff}
.btn-primary:hover{background:#1a2d5c}
.btn-outline{background:#fff;color:#2b4280;border:1px solid #2b4280}
.btn-outline:hover{background:#e8edf6}
.btn-danger{background:#fff;color:#c45555;border:1px solid #c45555}
.btn-danger:hover{background:#fef2f2}
.container{max-width:100%;margin:0 auto;padding:24px 40px}
.card{background:#fff;border-radius:12px;border:1px solid #e0e0e0;margin-bottom:20px;overflow:hidden;transition:opacity .2s}
.card.excluded{opacity:.4}
.card.excluded .card-body{display:none}
.card-header{padding:20px 24px;display:flex;align-items:flex-start;gap:16px;cursor:pointer;user-select:none}
.card-header:hover{background:#fafafa}
.toggle{width:28px;height:28px;border-radius:6px;border:2px solid #ccc;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.toggle.on{background:#2b4280;border-color:#2b4280}
.toggle.on::after{content:"\2713";color:#fff;font-size:16px;font-weight:700}
.toggle.off{background:#fee;border-color:#c45555}
.toggle.off::after{content:"\2715";color:#c45555;font-size:15px;font-weight:700}
.card-title{flex:1;font-size:19px;line-height:1.6;font-weight:500}
.card-meta{display:flex;gap:10px;flex-shrink:0;flex-wrap:wrap}
.tag{font-size:15px;padding:4px 12px;border-radius:12px;font-weight:500;white-space:nowrap}
.tag-contrib{background:#dbeafe;color:#1e40af}
.tag-original{background:#e8edf6;color:#555}
.tag-single{background:#f0fdf4;color:#166534}
.tag-multi{background:#fef3c7;color:#92400e}
.tag-group{background:#f3f4f6;color:#666}
.card-body{padding:0 24px 20px 68px}
.options{list-style:none;margin-top:10px}
.options li{font-size:18px;color:#555;padding:6px 0;display:flex;gap:10px}
.options li .val{color:#999;font-weight:500;min-width:26px}
.options li.correct{color:#166534;font-weight:500}
.options li.correct .val{color:#166534}
.card-footer{padding:8px 24px 16px 68px;font-size:16px;color:#999}
.empty{text-align:center;padding:80px;color:#999;font-size:18px}
.loading{text-align:center;padding:80px;color:#999;font-size:18px}
</style>
</head>
<body>
<div class="header">
  <h1 id="page-title"></h1>
  <div class="sub" id="page-sub"></div>
  <div class="stats">
    <span id="lbl-total"></span>
    <span id="lbl-kept"></span>
    <span id="lbl-removed"></span>
    <span>&middot;</span>
    <span id="lbl-contrib"></span>
    <span id="lbl-orig"></span>
    <span class="sync" id="syncStatus"></span>
  </div>
</div>
<div class="toolbar">
  <input type="text" id="search" placeholder="">
  <select id="filterSource"><option value=""></option><option value="contribution"></option><option value="original"></option></select>
  <select id="filterType"><option value=""></option><option value="single"></option><option value="multiple"></option></select>
  <select id="filterGroup"><option value=""></option></select>
  <select id="filterStatus"><option value=""></option><option value="kept"></option><option value="removed"></option></select>
  <div class="spacer"></div>
  <button class="btn btn-outline" id="btn-restore"></button>
  <button class="btn btn-danger" id="btn-remove"></button>
  <button class="btn btn-primary" id="btn-export"></button>
</div>
<div class="container" id="list"><div class="loading" id="loading-text"></div></div>
<script>
// All Chinese strings defined here - JS handles encoding correctly
var L = {
  title: '\u89C2\u7339\u8003\u8BD5\u9898\u5E93\u5BA1\u6838',
  sub: '\u70B9\u51FB\u9898\u76EE\u5207\u6362\u4FDD\u7559/\u79FB\u9664 \u00B7 \u4FEE\u6539\u5B9E\u65F6\u540C\u6B65\u5230\u6570\u636E\u5E93 \u00B7 \u5BFC\u51FA\u8F93\u51FA qv2 \u683C\u5F0F',
  search: '\u641C\u7D22\u9898\u76EE\u5185\u5BB9...',
  allSrc: '\u5168\u90E8\u6765\u6E90', contrib: '\u5F81\u9898', orig: '\u539F\u9898\u5E93',
  allType: '\u5168\u90E8\u9898\u578B', single: '\u5355\u9009', multi: '\u591A\u9009',
  allGroup: '\u5168\u90E8\u5206\u7EC4',
  allStatus: '\u5168\u90E8\u72B6\u6001', kept: '\u5DF2\u4FDD\u7559', removed: '\u5DF2\u79FB\u9664',
  restore: '\u6062\u590D\u5F53\u524D\u7B5B\u9009', remove: '\u79FB\u9664\u5F53\u524D\u7B5B\u9009',
  exportBtn: '\u5BFC\u51FA JSON', loading: '\u52A0\u8F7D\u4E2D...',
  total: '\u603B\u8BA1', ti: '\u9898', keep: '\u4FDD\u7559', rm: '\u79FB\u9664',
  synced: '\u5DF2\u540C\u6B65', syncing: '\u540C\u6B65\u4E2D...', syncFail: '\u540C\u6B65\u5931\u8D25',
  syncRemote: '\u5DF2\u540C\u6B65 (\u8FDC\u7AEF\u66F4\u65B0)', loaded: '\u5DF2\u52A0\u8F7D',
  noMatch: '\u6CA1\u6709\u5339\u914D\u7684\u9898\u76EE',
  confirmRm: '\u786E\u8BA4\u79FB\u9664\u5F53\u524D\u7B5B\u9009\u4E2D\u7684 ',
  confirmRm2: ' \u9053\u9898\uFF1F',
  check: '\u2713'
};

// Set static text
document.getElementById('page-title').textContent = L.title;
document.title = L.title;
document.getElementById('page-sub').textContent = L.sub;
document.getElementById('search').placeholder = L.search;
document.getElementById('loading-text').textContent = L.loading;
document.getElementById('btn-restore').textContent = L.restore;
document.getElementById('btn-remove').textContent = L.remove;
document.getElementById('btn-export').textContent = L.exportBtn;

// Set select options text
var fs = document.getElementById('filterSource').options;
fs[0].text = L.allSrc; fs[1].text = L.contrib; fs[2].text = L.orig;
var ft = document.getElementById('filterType').options;
ft[0].text = L.allType; ft[1].text = L.single; ft[2].text = L.multi;
var fst = document.getElementById('filterStatus').options;
fst[0].text = L.allStatus; fst[1].text = L.kept; fst[2].text = L.removed;
document.getElementById('filterGroup').options[0].text = L.allGroup;

// Wire buttons
document.getElementById('btn-restore').onclick = restoreFiltered;
document.getElementById('btn-remove').onclick = removeFiltered;
document.getElementById('btn-export').onclick = exportJSON;

var SB='https://bqzuoqeaqqhylukicvqa.supabase.co';
var AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxenVvcWVhcXFoeWx1a2ljdnFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5ODAxMzUsImV4cCI6MjA4OTU1NjEzNX0.9VThSnBOFXFiqxrzVSDkNtn1D-gBKYGpzpDkMT-G5_Q';
var DATA=[];

function H(x){return Object.assign({apikey:AK,Authorization:'Bearer '+AK},x||{})}
function setSS(c,t){var e=document.getElementById('syncStatus');e.className='sync'+(c?' '+c:'');e.textContent=t}

async function loadData(){
  var r=await fetch(SB+'/rest/v1/exam_questions?select=*&order=id',{headers:H()});
  DATA=await r.json();
  var gs=[...new Set(DATA.map(function(q){return q.group_name}))].sort();
  var s=document.getElementById('filterGroup');
  s.innerHTML='';
  var o0=document.createElement('option');o0.value='';o0.textContent=L.allGroup;s.appendChild(o0);
  gs.forEach(function(g){var o=document.createElement('option');o.value=g;o.textContent=g;s.appendChild(o)});
  render();setSS('ok',L.loaded+' '+DATA.length+' '+L.ti)
}

async function patchDB(id,del){
  setSS('',L.syncing);
  try{
    await fetch(SB+'/rest/v1/exam_questions?id=eq.'+encodeURIComponent(id),{
      method:'PATCH',headers:H({'Content-Type':'application/json',Prefer:'return=minimal'}),
      body:JSON.stringify({is_deleted:del,updated_at:new Date().toISOString()})
    });setSS('ok',L.synced)
  }catch(e){setSS('err',L.syncFail)}
}

async function patchBatch(ids,del){
  if(!ids.length)return;setSS('',L.syncing);
  try{
    await fetch(SB+'/rest/v1/exam_questions?id=in.('+ids.map(encodeURIComponent).join(',')+')',{
      method:'PATCH',headers:H({'Content-Type':'application/json',Prefer:'return=minimal'}),
      body:JSON.stringify({is_deleted:del,updated_at:new Date().toISOString()})
    });setSS('ok',L.synced)
  }catch(e){setSS('err',L.syncFail)}
}

function getAns(q){return q.type==='multiple'?(q.answers||[]):(q.answer?[q.answer]:[])}

function renderCard(q){
  var on=!q.is_deleted,ans=getAns(q);
  var ft=q.note||q.subtitle||'';
  return '<div class="card '+(on?'':'excluded')+'">'+'<div class="card-header" onclick="toggle(\''+q.id+'\')">'+'<div class="toggle '+(on?'on':'off')+'"></div>'+'<div class="card-title">'+q.title+'</div>'+'<div class="card-meta">'+'<span class="tag '+(q.source==='contribution'?'tag-contrib':'tag-original')+'">'+(q.source==='contribution'?L.contrib:L.orig)+'</span>'+'<span class="tag '+(q.type==='multiple'?'tag-multi':'tag-single')+'">'+(q.type==='multiple'?L.multi:L.single)+'</span>'+'<span class="tag tag-group">'+q.group_name+'</span>'+'</div></div>'+'<div class="card-body"><ul class="options">'+q.options.map(function(o){var c=ans.indexOf(o.value)>=0;return '<li class="'+(c?'correct':'')+'">'+'<span class="val">'+o.value+'.</span> '+o.label+(c?' '+L.check:'')+'</li>'}).join('')+'</ul></div>'+(ft?'<div class="card-footer">'+ft+'</div>':'')+'</div>'
}

function getFiltered(){
  var s=document.getElementById('search').value.toLowerCase(),
      src=document.getElementById('filterSource').value,
      ty=document.getElementById('filterType').value,
      gr=document.getElementById('filterGroup').value,
      st=document.getElementById('filterStatus').value;
  return DATA.filter(function(q){
    if(s&&q.title.toLowerCase().indexOf(s)<0&&!q.options.some(function(o){return o.label.toLowerCase().indexOf(s)>=0}))return false;
    if(src&&q.source!==src)return false;
    if(ty&&q.type!==ty)return false;
    if(gr&&q.group_name!==gr)return false;
    if(st==='kept'&&q.is_deleted)return false;
    if(st==='removed'&&!q.is_deleted)return false;
    return true
  })
}

function render(){
  var f=getFiltered(),l=document.getElementById('list');
  l.innerHTML=f.length?f.map(renderCard).join(''):'<div class="empty">'+L.noMatch+'</div>';
  var tot=DATA.length,del=DATA.filter(function(q){return q.is_deleted}).length;
  document.getElementById('lbl-total').innerHTML=L.total+' <span class="num">'+tot+'</span> '+L.ti;
  document.getElementById('lbl-kept').innerHTML=L.keep+' <span class="num">'+(tot-del)+'</span>';
  document.getElementById('lbl-removed').innerHTML=L.rm+' <span class="num removed">'+del+'</span>';
  document.getElementById('lbl-contrib').innerHTML=L.contrib+' <span class="num">'+DATA.filter(function(q){return q.source==='contribution'&&!q.is_deleted}).length+'</span>';
  document.getElementById('lbl-orig').innerHTML=L.orig+' <span class="num">'+DATA.filter(function(q){return q.source==='original'&&!q.is_deleted}).length+'</span>';
}

function toggle(id){
  var q=DATA.find(function(x){return x.id===id});
  if(!q)return;q.is_deleted=!q.is_deleted;render();patchDB(id,q.is_deleted)
}

function removeFiltered(){
  var f=getFiltered().filter(function(q){return !q.is_deleted});
  if(!f.length)return;
  if(!confirm(L.confirmRm+f.length+L.confirmRm2))return;
  var ids=[];f.forEach(function(q){q.is_deleted=true;ids.push(q.id)});
  render();patchBatch(ids,true)
}

function restoreFiltered(){
  var f=getFiltered().filter(function(q){return q.is_deleted});
  if(!f.length)return;
  var ids=[];f.forEach(function(q){q.is_deleted=false;ids.push(q.id)});
  render();patchBatch(ids,false)
}

function exportJSON(){
  var kept=DATA.filter(function(q){return !q.is_deleted});
  var out=kept.map(function(q){
    var item={id:q.id,title:q.title,subtitle:q.subtitle||'',required:true,options:q.options};
    if(q.type==='multiple')item.answers=q.answers;else item.answer=q.answer;
    item.type=q.type;item.group=q.group_name;
    if(q.user_name)item.user=q.user_name;
    return item
  });
  var b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='qv2_final.json';a.click();URL.revokeObjectURL(a.href)
}

var st;document.getElementById('search').addEventListener('input',function(){clearTimeout(st);st=setTimeout(render,200)});
document.getElementById('filterSource').addEventListener('change',render);
document.getElementById('filterType').addEventListener('change',render);
document.getElementById('filterGroup').addEventListener('change',render);
document.getElementById('filterStatus').addEventListener('change',render);

setInterval(function(){
  fetch(SB+'/rest/v1/exam_questions?select=id,is_deleted',{headers:H()})
  .then(function(r){return r.json()})
  .then(function(rows){var ch=false;rows.forEach(function(row){
    var q=DATA.find(function(x){return x.id===row.id});
    if(q&&q.is_deleted!==row.is_deleted){q.is_deleted=row.is_deleted;ch=true}
  });if(ch){render();setSS('ok',L.syncRemote)}})
  .catch(function(){})
},30000);

loadData();
</script>
</body>
</html>
